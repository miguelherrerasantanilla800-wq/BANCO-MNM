global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: docker-containers
    static_configs:
      - targets: ["docker-exporter:9101"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
