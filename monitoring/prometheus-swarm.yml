global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: docker-containers
    dns_sd_configs:
      - names: ["tasks.docker-exporter"]
        type: A
        port: 9101
        refresh_interval: 30s

  - job_name: cadvisor
    dns_sd_configs:
      - names: ["tasks.cadvisor"]
        type: A
        port: 8080
        refresh_interval: 30s
